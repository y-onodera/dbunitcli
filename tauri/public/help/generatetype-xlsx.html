  <h1>generateType: xlsx / xls（Excelファイル生成）</h1>
  <p>jxls テンプレートファイルを使い、Excel ファイルを生成します。<code>template</code> オプションでテンプレートファイルを指定します。jxls 固有の設定は <code>jxls option</code> の展開ボタンから設定します（<a href="jxls.html">Jxls</a> 参照）。<code>xlsx</code> は Excel 2007 以降形式、<code>xls</code> は Excel 97-2003 形式で出力します。</p>
  <table>
    <tr><th>項目</th><th>説明</th><th>デフォルト</th></tr>
    <tr><td>lazyLoad</td><td>Excel データを遅延ロードする（大規模データセット向け）</td><td>false</td></tr>
