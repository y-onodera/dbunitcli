  <h1>Traversal</h1>
  <p>ディレクトリを <code>src</code> に指定した際の走査条件です。<a href="dataset-load-form.html">Dataset Load Form</a> の <code>traversal</code> セクションにある <code>traversal option</code> の展開ボタンから設定します。</p>
  <table>
    <tr><th>項目</th><th>説明</th></tr>
    <tr><td>extension</td><td>対象とするファイル拡張子</td></tr>
    <tr><td>recursive</td><td>サブディレクトリを再帰的に走査するか</td></tr>
    <tr><td>regInclude</td><td>対象ファイル名の包含条件（正規表現）</td></tr>
    <tr><td>regExclude</td><td>対象ファイル名の除外条件（正規表現）</td></tr>
  </table>
