  <h1>Traversal</h1>
  <p><code>src</code> にディレクトリを指定したときに、どのファイルを読み込むかの条件です。<a href="dataset-load-form.html">Dataset Load Form</a> の <code>traversal option</code> から設定します。</p>

  <h2 id="section-options">設定項目</h2>
  <table>
    <tr><th>項目</th><th>説明</th></tr>
    <tr><td>extension</td><td>対象にするファイルの拡張子</td></tr>
    <tr><td>recursive</td><td>ON にすると、サブディレクトリの中も読み込む</td></tr>
    <tr><td>regInclude</td><td>対象にするファイル名の条件（正規表現）</td></tr>
    <tr><td>regExclude</td><td>対象から外すファイル名の条件（正規表現）</td></tr>
  </table>
