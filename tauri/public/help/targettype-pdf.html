  <p><a href="compare.html">&larr; Compare に戻る</a></p>
  <h1>Target Type: pdf</h1>
  <p>PDF ファイルをページ画像として比較します。<code>oldData</code> / <code>newData</code> には Source Type = <code>file</code> のディレクトリを指定してください。拡張子は自動的に <code>.pdf</code> に固定されます。</p>
  <ul>
    <li>ファイル名が一致するペアを 1 対 1 で突き合わせます</li>
    <li>差分の許容度や描画方法は <code>imageOption</code>（<a href="image.html">Image Option</a>）で調整できます</li>
    <li><code>setting</code> は無視されます（比較キーは内部で <code>NAME</code> 固定）</li>
  </ul>
  <p>比較結果の形式は <a href="compare.html#result-image-pdf">image / pdf モードの比較結果</a>を参照してください。</p>
