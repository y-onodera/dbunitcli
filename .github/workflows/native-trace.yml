# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: native-trace
on:
  push:
    paths:
      - '.github/workflows/native-trace.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up graalvm
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: postgresql setup
        uses: ikalnytskyi/action-setup-postgres@v4
        with:
          username: admin
          password: admin
          database: test
          port: 5433
        id: postgres
      - name: Save native-image-config
        run: |
          mvn clean test -Pnative-trace "-fcore/pom.xml"
      - uses: actions/upload-artifact@v7
        with:
          name: native-image-config
          path: |
            ./core/target/native/agent-output/**/*.json
      # sidecarはcoreのSNAPSHOTに依存するため、親pomとcoreをローカルへインストールしてからトレースする
      - name: Install core for sidecar
        run: |
          mvn install "-DskipTests" --projects core --also-make
      - name: Save sidecar native-image-config
        run: |
          mvn test -Pnative-trace "-fsidecar/pom.xml"
      # 既存のreachability-metadata.jsonへマージした結果も確認できるようにする
      - name: Merge sidecar native-image-config
        continue-on-error: true
        run: |
          mvn native:metadata-copy -Pnative-trace "-fsidecar/pom.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-image-config-sidecar
          path: |
            ./sidecar/target/native/agent-output/**/*.json
            ./sidecar/src/main/resources/META-INF/native-image/**/reachability-metadata.json
